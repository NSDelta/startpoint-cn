# ios-tweak.yml —— 构建 SpLogin.dylib / .deb（P10-B）
#
# 为什么必须在 CI 上编译：本机（Windows）没有 make/clang/ldid，也没有 WSL 发行版。
# 官方包注入线（P10-A）与越狱安装线（本文件）都只能在这里出产物。
#
# [已验证-CI-部分] 首次真实运行 = run 36417028903（fork NSDelta/startpoint-cn，
#    head_sha ce51e155，event=push，两个 matrix 腿都是 FAILURE）。那次实测确认**通过**的步骤：
#      环境信息 / actions/checkout@v7 / brew install ldid / 克隆 Theos / chmod +x，
#    失败点是 `make`（exit code 2，日志当时无法取回）。
#    ⇒ 下面这些步骤的写法已被证明可用，不要再"顺手改好"。
#
# 地址注入：默认用 hygiene 白名单占位 192.168.1.10:8001（**不是**任何真实机器）。
# 真实地址只能从 workflow_dispatch 的输入传进来，且**绝不写进仓库文件**。
#
# ── 失败诊断通道（无凭据可读）─────────────────────────────────────────────
# GitHub 的 job 日志 API 需要仓库权限（匿名 GET /actions/runs/<id>/logs 返回 403），
# 所以编译失败时外部读者拿不到 make 的输出。本工作流因此把**完整构建日志**在
# `if: always()` 的诊断步骤里提交并强推到一条一次性分支：
#     refs/heads/ci-diag/<run_id>/<leg>          leg ∈ {rootful, rootless}
# 读取方式（无需任何凭据，公开仓库）：
#     git fetch origin 'refs/heads/ci-diag/*:refs/remotes/origin/ci-diag/*'
#     然后看 origin/ci-diag/<run_id>/<leg>:ci-diag/<run_id>/<leg>/build.log
# 说明：用 GITHUB_TOKEN 推送不会再次触发 workflow，所以没有回环；每个 run_id 一条分支，
# 两个 matrix 腿各写各的文件，互不覆盖。

name: ios-tweak

on:
  workflow_dispatch:
    inputs:
      sp_login_host:
        description: "自建服务地址 host:port（默认是白名单占位值，真机请填你自己的）"
        required: false
        default: "192.168.1.10:8001"
      sp_login_forwarding:
        description: "数据转发开关：1=dylib 内 NSURLProtocol 改写官方请求（历史行为）；0=编译期剔除，只加登录，端点转发交给 IPA 静态改写"
        required: false
        default: "1"
  push:
    paths:
      - "ios/tweak/**"
      - ".github/workflows/ios-tweak.yml"

# contents: write 是给下面的「诊断分支强推」用的；读取权限之外不需要别的。
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.scheme || 'rootful' }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # rootless = Dopamine / 无根越狱（服主那台 iPhone 7 Plus / iOS 15.8.3 走这个）
        scheme: ["rootless", ""]
    steps:
      - uses: actions/checkout@v7

      - name: 环境信息（取证）
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version || true
          uname -m
          clang --version || true

      - name: 安装 ldid
        run: |
          set -euo pipefail
          brew install ldid
          which ldid || brew link --overwrite ldid
          ldid -h >/dev/null || true

      - name: 克隆 Theos
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          # 网络不稳：重试 5 次、指数退避；每次失败先清掉半成品目录再重来。
          ok=0
          for i in 1 2 3 4 5; do
            rm -rf "$THEOS"
            if git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"; then
              ok=1
              break
            fi
            echo "::warning::克隆 Theos 第 $i 次失败，退避 $((i * 10))s 后重试"
            sleep $((i * 10))
          done
          [ "$ok" = "1" ] || { echo "::error::克隆 Theos 连续 5 次失败"; exit 1; }
          test -f "$THEOS/makefiles/common.mk" || { echo "::error::Theos 克隆不完整：缺 $THEOS/makefiles/common.mk"; exit 1; }
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Theos HEAD: $(git -C "$THEOS" rev-parse HEAD)"

      - name: 可执行位（Windows 检出物没有）
        run: |
          set -euo pipefail
          chmod +x ios/tweak/layout/DEBIAN/postinst ios/tweak/layout/DEBIAN/prerm

      - name: 工具链版本（取证）
        run: |
          set -euo pipefail
          make --version | head -1
          dpkg-deb --version | head -1 || true
          echo "resolved SP_LOGIN_HOST=${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }} SP_LOGIN_FORWARDING=${{ github.event.inputs.sp_login_forwarding || '1' }}"

      # 编译输出全量落到 $RUNNER_TEMP/build.log（不在工作树里，避免污染随后要提交的 git 状态）。
      # 用 pipefail + tee：步骤自身照常因 make 失败而失败，不靠 continue-on-error 掩盖。
      - name: make（编译 SpLogin.dylib）
        working-directory: ios/tweak
        env:
          SP_LOGIN_HOST: ${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }}
          SP_LOGIN_FORWARDING: ${{ github.event.inputs.sp_login_forwarding || '1' }}
        run: |
          set -euo pipefail
          case "$SP_LOGIN_FORWARDING" in 0|1) ;; *) echo "::error::SP_LOGIN_FORWARDING 只能是 0 或 1，收到：$SP_LOGIN_FORWARDING"; exit 1 ;; esac
          if [ -n "${{ matrix.scheme }}" ]; then
            export THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          fi
          echo "=== pwd: $(pwd)"
          echo "=== SP_LOGIN_HOST=${SP_LOGIN_HOST}"
          echo "=== SP_LOGIN_FORWARDING=${SP_LOGIN_FORWARDING}"
          echo "=== THEOS=${THEOS:-<unset>}"
          echo "=== THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME:-<unset>}"
          echo "=== command: make FINALPACKAGE=1 SP_LOGIN_HOST=\"\${SP_LOGIN_HOST}\" SP_LOGIN_FORWARDING=\"\${SP_LOGIN_FORWARDING}\""
          set -o pipefail
          make FINALPACKAGE=1 SP_LOGIN_HOST="$SP_LOGIN_HOST" SP_LOGIN_FORWARDING="$SP_LOGIN_FORWARDING" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: make package（打成 .deb）
        working-directory: ios/tweak
        env:
          SP_LOGIN_HOST: ${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }}
          SP_LOGIN_FORWARDING: ${{ github.event.inputs.sp_login_forwarding || '1' }}
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.scheme }}" ]; then
            export THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          fi
          echo "=== command: make package FINALPACKAGE=1 SP_LOGIN_HOST=\"\${SP_LOGIN_HOST}\" SP_LOGIN_FORWARDING=\"\${SP_LOGIN_FORWARDING}\""
          set -o pipefail
          make package FINALPACKAGE=1 SP_LOGIN_HOST="$SP_LOGIN_HOST" SP_LOGIN_FORWARDING="$SP_LOGIN_FORWARDING" 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # 开关必须**在产物上**成立，而不是只在命令行上成立：
      # 转发关闭时，SpLoginURLProtocol 这个类名不得出现在 dylib 里（源文件已被移出编译单元）。
      # 这是本开关唯一的机器可验证判据，故放在这里 fail-fast，不放诊断通道。
      #
      # 两条用血换来的纪律（run 36720150349 两条腿都在本步静默变红，而编译与打包其实都成功）：
      # ① 绝不能写 `hits=$(grep … | wc -l)`：grep 无命中时退出码是 1，配合外层 shell 的 -e 与
      #    本步的 pipefail，赋值语句会直接终止整步 —— 且恰好炸在「应该通过」的那一侧，
      #    一个字符都来不及打印。⇒ grep 必须包进 `( … || true )`，且先 echo 再判定。
      # ② `find .theos/obj -name 'SpLogin*.dylib' | head -1` 拿到的是 .theos/obj/arm64/SpLogin.dylib
      #    （未 strip 的中间产物）；真正要交付、要装进 deb 的是 deb 里那一份。
      #    ⇒ 断言以 **deb 内实际安装的那份**为准，中间产物只作旁证。
      - name: 断言 SP_LOGIN_FORWARDING 生效（类名级二进制自证）
        if: always()
        working-directory: ios/tweak
        env:
          SP_LOGIN_FORWARDING: ${{ github.event.inputs.sp_login_forwarding || '1' }}
        run: |
          set -uo pipefail

          # 判据一：从 deb 里解出真正会被安装的那份 dylib（最高保真）
          shipped=""
          deb=$(ls packages/*.deb 2>/dev/null | head -1 || true)
          if [ -n "$deb" ]; then
            rm -rf "$RUNNER_TEMP/shipped"
            mkdir -p "$RUNNER_TEMP/shipped"
            dpkg-deb -x "$deb" "$RUNNER_TEMP/shipped" >/dev/null 2>&1 || true
            shipped=$(find "$RUNNER_TEMP/shipped" -name 'SpLogin*.dylib' 2>/dev/null | head -1 || true)
          fi

          # 判据二：obj 树里的每一份 dylib（含未 strip 的 arm64 中间产物 —— strip 藏不住一个
          # 类名，未 strip 的那份最能暴露残留）。dSYM 里的 DWARF 副本不是产物，排除。
          stubs=$(find .theos/obj -name 'SpLogin*.dylib' -not -path '*.dSYM/*' 2>/dev/null | sort || true)

          targets=""
          if [ -n "$shipped" ]; then targets="$shipped"; fi
          if [ -n "$stubs" ]; then targets="${targets}${targets:+ }$stubs"; fi
          if [ -z "$targets" ]; then
            echo "::error::既没从 deb 里取到 dylib、也没找到中间产物 —— 开关无法自证，按失败处理"
            exit 1
          fi

          echo "=== 开关自证: SP_LOGIN_FORWARDING=${SP_LOGIN_FORWARDING} 待检 ${targets}"
          rc=0
          for f in $targets; do
            # grep 无命中 ⇒ 退出码 1，必须吞掉，否则 -e + pipefail 会静默终止整步
            hits=$( (grep -a -o 'SpLoginURLProtocol' "$f" || true) | wc -l | tr -d ' ')
            bytes=$(wc -c < "$f" | tr -d ' ')
            echo "--- file=${f} bytes=${bytes} SpLoginURLProtocol 命中=${hits}"
            if [ "$SP_LOGIN_FORWARDING" = "0" ] && [ "$hits" != "0" ]; then
              echo "::error::SP_LOGIN_FORWARDING=0 但 ${f} 里仍含 SpLoginURLProtocol（${hits} 处）—— 转发没有被编译期剔除"
              rc=1
            fi
            if [ "$SP_LOGIN_FORWARDING" != "0" ] && [ "$hits" = "0" ]; then
              echo "::error::SP_LOGIN_FORWARDING=${SP_LOGIN_FORWARDING} 但 ${f} 里没有 SpLoginURLProtocol —— 转发被意外剔除"
              rc=1
            fi
          done
          if [ "$rc" = "0" ]; then echo "开关自证通过 ✓"; fi
          exit "$rc"

      - name: 产物清单（取证）
        if: always()
        working-directory: ios/tweak
        env:
          DIAG_LEG: ${{ matrix.scheme || 'rootful' }}
        run: |
          set -uo pipefail
          echo "=== .theos/obj 树（Theos 会把目标放进 TARGET/SCHEME 子目录）"
          find .theos/obj -name '*.dylib' -o -name '*.a' 2>/dev/null | sort || true
          ls -lR .theos/obj 2>/dev/null | head -50 || true
          echo "=== packages"
          ls -l packages 2>/dev/null || true
          for deb in packages/*.deb; do
            [ -f "$deb" ] || continue
            echo "== $deb"
            dpkg-deb -I "$deb" || true
            echo "== $deb 内容（确认 SpLogin.dylib 与 SpLogin.plist 都在、且 rootless 落在 /var/jb）"
            dpkg-deb -c "$deb" || true
            # 同一份清单再走 ::notice —— 这样「deb 里到底有没有过滤器 plist」这件事
            # 不需要任何凭据就能从 check-run annotations 读到（step 日志仍需 admin 权限）。
            listing=$(dpkg-deb -c "$deb" 2>/dev/null | head -40 | sed -e 's/\r$//' | paste -sd'|' - || true)
            # 注意：这里**不能**写成 `[ -n "$listing" ] && printf ...`。当 listing 为空时
            # 该短路表达式返回 1，而它又是 for 循环体的最后一条命令 ⇒ 循环返回 1 ⇒ 在
            # set -uo pipefail 下整步失败。实测 run 36424802642 两条腿都在本步变红，
            # 而编译与打包其实都是成功的（结论被取证步骤误伤）。用 if 显式收尾成 0。
            if [ -n "$listing" ]; then
              printf '::notice title=deb(%s)::%s\n' "$DIAG_LEG" "$listing"
            fi
          done
          # 本步是取证步骤，无论上面命中与否都不得改变 job 结论。
          exit 0

      # 失败也要留下证据：把完整构建日志强推到一次性分支，供无凭据读者取回。
      - name: 诊断日志（失败时也可无凭据取回）
        if: always()
        env:
          DIAG_LEG: ${{ matrix.scheme || 'rootful' }}
          DIAG_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # 这一步是诊断通道，不得改变 job 结论（构建失败已由上面的 make 步骤定死），
          # 但**每一次失败都必须说出原因**——静默 exit 0 会让 "全文日志 + 注解" 两条通道同时失联。
          DIAG_REF="ci-diag/${DIAG_RUN}/${DIAG_LEG}"
          DIAG_DIR="ci-diag/${DIAG_RUN}/${DIAG_LEG}"
          mkdir -p "$DIAG_DIR"
          {
            echo "run_id=${DIAG_RUN}"
            echo "leg=${DIAG_LEG}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "head_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "runner_os=${RUNNER_OS}"
            echo "SP_LOGIN_HOST=${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }}"
            echo "SP_LOGIN_FORWARDING=${{ github.event.inputs.sp_login_forwarding || '1' }}"
            echo "toolchain=$(make --version 2>&1 | head -1)"
            echo "build_log_bytes=$(wc -c < "$RUNNER_TEMP/build.log" 2>/dev/null || echo 0)"
          } > "$DIAG_DIR/meta.txt"
          if [ -s "$RUNNER_TEMP/build.log" ]; then
            cp "$RUNNER_TEMP/build.log" "$DIAG_DIR/build.log"
          else
            echo "build.log 不存在或为空（构建步骤可能从未开始）——仍推送 meta.txt 以留下痕迹" \
              > "$DIAG_DIR/build.log"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 逐文件 git add -f：目录级 add 遇到被忽略的路径会整体失败，逐文件更可靠。
          for f in "$DIAG_DIR/meta.txt" "$DIAG_DIR/build.log"; do
            git add -f -- "$f" || echo "::warning::诊断文件无法加入索引：$f"
          done
          if ! git commit -q -m "ci-diag: ${DIAG_LEG} run ${DIAG_RUN}"; then
            echo "::warning::诊断提交失败（可能索引为空）"
            git status --short | head -20
            exit 0
          fi
          # 这里的推送**不能**依赖 ${GITHUB_TOKEN} 环境变量：它不是 Actions 的默认环境变量，
          # 在 set -u 下展开未定义变量会让 bash 立刻以 unbound variable 退出（实测该步骤变红、
          # 远端一个 ci-diag ref 都没有）。改用 ${{ secrets.GITHUB_TOKEN }}，由 Actions 在
          # 求值期注入。读取权限由顶部 permissions: contents: write 提供，两者缺一不可。
          if git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:refs/heads/${DIAG_REF}" 2>&1; then
            echo "诊断日志已推送：refs/heads/${DIAG_REF}"
            echo "读取：git fetch origin 'refs/heads/ci-diag/*:refs/remotes/origin/ci-diag/*'"
            echo "     然后看 origin/${DIAG_REF}:${DIAG_DIR}/build.log"
          else
            # 最常见原因：fork 的 Actions 权限是只读，token 无 contents:write。
            # 明确喊出来，否则读者只会看到“分支不存在”而不知为何。
            echo "::warning title=diag-push::诊断分支推送失败（fork 可能未授予 Actions 写权限）；本腿日志仍可从 check-run 注解通道读取"
          fi

      # 第三通道：把**产物本身**推成一次性分支。Actions artifact 的下载接口需要凭据
      # （匿名 GET /actions/artifacts/<id>/zip 是 401/403），而这条通道让任何人在公开仓库上
      # 无凭据就能取到 deb/dylib —— 真机验证靠它。
      - name: 产物出仓（无需凭据即可取回 deb/dylib）
        if: always()
        working-directory: ios/tweak
        env:
          DIAG_LEG: ${{ matrix.scheme || 'rootful' }}
          DIAG_RUN: ${{ github.run_id }}
          RESOLVED_HOST: ${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }}
          RESOLVED_FORWARDING: ${{ github.event.inputs.sp_login_forwarding || '1' }}
        run: |
          set -uo pipefail
          # 同 ci-diag：诊断通道不得改变 job 结论，也不能静默退出。
          OUT_REF="ci-out/${DIAG_RUN}/${DIAG_LEG}"
          # 注意：本步骤 working-directory 是 ios/tweak，所以必须用绝对路径锚定到仓库根，
          # 否则产物会落在 ios/tweak/ci-out/... （第一版实测就是这样，路径别扭且难清理）。
          OUT_DIR="${GITHUB_WORKSPACE}/ci-out/${DIAG_RUN}/${DIAG_LEG}"
          mkdir -p "$OUT_DIR"
          dylib=$(find .theos/obj -name 'SpLogin*.dylib' 2>/dev/null | head -1 || true)
          deb=""
          for f in packages/*.deb; do [ -f "$f" ] && deb="$f" && break; done
          dylib_bytes=0; dylib_sha="(none)"
          deb_bytes=0;   deb_sha="(none)"
          [ -n "$dylib" ] && dylib_bytes=$(wc -c < "$dylib") && dylib_sha=$(shasum -a 256 "$dylib" | cut -d' ' -f1)
          [ -n "$deb" ]   && deb_bytes=$(wc -c < "$deb")     && deb_sha=$(shasum -a 256 "$deb" | cut -d' ' -f1)
          {
            echo "run_id=${DIAG_RUN}"
            echo "leg=${DIAG_LEG}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "head_sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "SP_LOGIN_HOST=${RESOLVED_HOST}"
            echo "SP_LOGIN_FORWARDING=${RESOLVED_FORWARDING}"
            echo "dylib=${dylib:-（没有产物）}"
            echo "dylib_bytes=${dylib_bytes}"
            echo "dylib_sha256=${dylib_sha}"
            echo "deb=${deb:-（没有产物）}"
            echo "deb_bytes=${deb_bytes}"
            echo "deb_sha256=${deb_sha}"
          } > "$OUT_DIR/meta.txt"
          if [ -n "$dylib" ]; then cp "$dylib" "$OUT_DIR/SpLogin.dylib"; fi
          if [ -n "$deb" ];   then cp "$deb"   "$OUT_DIR/"; fi
          printf '::notice title=ci-out(%s)::forwarding=%s dylib=%s bytes dylib_sha256=%s; deb=%s bytes deb_sha256=%s\n' \
            "$DIAG_LEG" "$RESOLVED_FORWARDING" "$dylib_bytes" "$dylib_sha" "$deb_bytes" "$deb_sha"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 逐文件 git add -f：.deb/.dylib 很可能被 .gitignore 吞掉，目录级 add 会整体失败。
          staged=0
          for f in "$OUT_DIR/meta.txt" "$OUT_DIR/SpLogin.dylib" "$OUT_DIR"/*.deb; do
            [ -f "$f" ] || continue
            if git add -f -- "$f"; then staged=$((staged + 1)); else echo "::warning::产物无法加入索引：$f"; fi
          done
          if [ "$staged" -eq 0 ]; then
            echo "::warning title=ci-out::没有任何产物可推送（构建可能从未产出 dylib/deb）"
            exit 0
          fi
          if ! git commit -q -m "ci-out: ${DIAG_LEG} run ${DIAG_RUN}"; then
            echo "::warning::产物提交失败（可能索引为空）"
            git status --short | head -20
            exit 0
          fi
          if git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:refs/heads/${OUT_REF}" 2>&1; then
            echo "产物已推送：refs/heads/${OUT_REF}"
            echo "读取：git fetch origin 'refs/heads/ci-out/*:refs/remotes/origin/ci-out/*'"
            echo "     然后看 origin/${OUT_REF}:${OUT_DIR}/"
          else
            echo "::warning title=ci-out-push::产物分支推送失败（fork 可能未授予 Actions 写权限）；产物仍可从 Actions artifact 页面手动下载"
          fi
          # 同「产物清单」：本步是诊断/出仓通道，任何分支都不得改变 job 结论。
          exit 0

      # 第二通道（不依赖任何仓库设置、纯匿名可读）：把编译器输出的要害做成 check-run 注解。
      # 匿名读法：GET https://api.github.com/repos/NSDelta/startpoint-cn/check-runs/<job_id>/annotations
      # 这一步只输出注解，不改变 job 结论——job 的失败仍由上面 make 步骤本身决定。
      - name: 错误注解（把编译器要害变成 check-run annotation）
        if: always()
        env:
          DIAG_LEG: ${{ matrix.scheme || 'rootful' }}
        run: |
          set -uo pipefail
          # 注解通道不依赖 git push 权限，所以这里的判定只看 build.log 内容，不看 job 结论。
          if [ ! -s "$RUNNER_TEMP/build.log" ]; then
            echo "::notice title=SpLogin(${DIAG_LEG})::该腿未产生构建输出（make 步骤可能未开始）"
            exit 0
          fi
          echo "::notice title=build.log(${DIAG_LEG})::共 $(wc -l < "$RUNNER_TEMP/build.log") 行 / $(wc -c < "$RUNNER_TEMP/build.log") 字节"
          # ── 零权限全文通道：整份 build.log 按每 30 行一条 ::notice 发出 ──────────────
          # notice 不占「每个步骤最多 10 条 error/warning 注解」的额度，所以整份日志走 notice，
          # 不会把真错误挤出配额。这条通道**不需要任何 token、push 权限或仓库设置**，
          # 即使通道 A（ci-diag 分支）被 fork 的只读权限挡死，ld 原文照样匿名可读。
          total_lines=$(wc -l < "$RUNNER_TEMP/build.log")
          max_lines=750   # 25 块 × 30 行；小日志就是全文
          [ "$total_lines" -le "$max_lines" ] || echo "::warning title=build.log(${DIAG_LEG})::日志共 ${total_lines} 行，只发前 ${max_lines} 行（其余靠通道 A）"
          if [ "$total_lines" -le "$max_lines" ]; then emit_to=$total_lines; else emit_to=$max_lines; fi
          start=1
          chunk=0
          while [ "$start" -le "$emit_to" ]; do
            end=$((start + 29))
            [ "$end" -gt "$emit_to" ] && end=$emit_to
            chunk=$((chunk + 1))
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              printf '::notice title=make-log(%s)-%02d::%s\n' "${DIAG_LEG}" "$chunk" "${line:0:400}"
            done < <(sed -n "${start},${end}p" "$RUNNER_TEMP/build.log")
            start=$((end + 1))
          done
          echo "::notice title=make-log(${DIAG_LEG})::全文通道已发 ${chunk} 块"
          # ── 分类要点（error 级，占每步 10 条额度）：只报要害，不铺原文 ──────────────
          n=0
          # 只报 "匹配到的那一行" 会漏掉 clang 的真错误：多行 note 的末尾是
          # "N errors generated."，而真正的 error: 行在它前面几行。所以匹配后再带上下文窗口。
          emit() { # $1=类别名  $2=正则  [$3=每处上下文行数，默认 5]
            local ctx="${3:-5}" hits ln from to
            hits=$(grep -nEi "$2" "$RUNNER_TEMP/build.log" 2>/dev/null | cut -d: -f1 | head -3 || true)
            [ -n "$hits" ] || return 0
            for ln in $hits; do
              [ "$n" -ge 8 ] && break
              from=$(( ln > ctx ? ln - ctx : 1 ))
              to=$(( ln + ctx ))
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                n=$((n + 1))
                printf '::error title=%s-%02d(%s)::%s\n' "$1" "$n" "${DIAG_LEG}" "${line:0:400}"
                [ "$n" -ge 8 ] && break
              done < <(sed -n "${from},${to}p" "$RUNNER_TEMP/build.log")
            done
            # 关键：函数必须以 0 结尾。[ "$n" -ge 20 ] && break 在 n<20 时为假（退出码 1），
            # 会让 emit 返回 1；而调用点写成 `[ cond ] || emit ...` 时，脚本最后一条命令
            # 非零即整个步骤 exit 1（实测该步骤因此变红、注解反而变少）。
            return 0
          }
          # 顺序即重要性：编译器硬错误 → 链接错误 → Theos/make 自身错误。
          emit clang-error 'error:|fatal error|no member named|no visible @interface|expected ' 6
          [ "$n" -ge 8 ] || emit link-error 'Undefined symbols|undefined reference|ld: |linker command failed|_OBJC_CLASS_\$_' 8
          [ "$n" -ge 8 ] || emit theos-error 'No such file or directory|missing a filter property list|is not a valid|does not exist' 4
          echo "::notice title=SpLogin(${DIAG_LEG})::分类注解 ${n} 条；全文见上面 make-log 分块"
          # 显式 exit 0：这一步是诊断，绝不能让自身状态影响 job 结论（失败由 make 步骤定死）。
          exit 0

      # 通过时也留一条 notice：让绿色运行同样可审计（解析出的 host、腿、产物路径与大小）。
      - name: 通过性摘要（notice）
        if: success()
        working-directory: ios/tweak
        env:
          DIAG_LEG: ${{ matrix.scheme || 'rootful' }}
        run: |
          set -uo pipefail
          dylib=$(find .theos/obj -name 'SpLogin*.dylib' 2>/dev/null | head -1)
          deb=$(ls packages/*.deb 2>/dev/null | head -1)
          echo "::notice title=SpLogin(${DIAG_LEG})::SP_LOGIN_HOST=${{ github.event.inputs.sp_login_host || '192.168.1.10:8001' }} SP_LOGIN_FORWARDING=${{ github.event.inputs.sp_login_forwarding || '1' }} scheme=${DIAG_LEG:-rootful} dylib=${dylib:-<none>} deb=${deb:-<none>}"
          if [ -n "$dylib" ]; then
            ls -l "$dylib" || true
            size=$(wc -c < "$dylib" 2>/dev/null || echo '?')
            echo "::notice title=SpLogin(${DIAG_LEG})::dylib 大小 ${size} 字节"
          fi

      # 产物上传拆成两步，理由是实测教训：把 packages/*.deb 与 .theos/obj/**/*.dylib 写在
      # 同一个 path 里时，只要**第一个 glob 无匹配**（构建失败即如此），upload-artifact 会以
      # "No files were found with the provided path" 直接失败，dylib 与 build.log 全都传不上去。
      # 诊断日志必须独立上传且在 always() 下运行——它是失败时唯一的原文出口。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp-login-buildlog-${{ matrix.scheme || 'rootful' }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp-login-${{ matrix.scheme || 'rootful' }}
          # Theos 把目标放在 .theos/obj/<TARGET>/<SCHEME>/ 之类的子目录里，不是 .theos/obj/SpLogin.dylib。
          # 用 subdir-glob 匹配真实布局；无匹配时只 warn 而不 error，否则失败运行连诊断日志都传不出来。
          path: |
            ios/tweak/packages/*.deb
            ios/tweak/.theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 30
