# ios-autoclick.yml —— 构建两个交付物：越狱 deb + 非越狱 dylib（自动点击）
#
# 为什么必须在这里编译：开发机是 Windows，没有 clang/Xcode/Theos，也没有 WSL。
# 本工作流同时承担**iOS 平台层唯一的编译验证**（ios/auto/ios/*.m 在本机从未编过）
# 与 **core 的交叉编译器验证**（同一份 C99 在 clang 下再跑一遍 377 个用例，外加一次能力上限审计）。
#
# ── 三条诊断通道（都不需要仓库凭据即可读回）──────────────────────────────
#   ① refs/heads/ci-diag/<run_id>/<leg>   完整构建日志 + meta.txt
#   ② refs/heads/ci-out/<run_id>/<leg>    产物本身（.deb / .dylib）
#   ③ check-run annotations（::notice 分块 + ::error 分类）——纯匿名 HTTP 可读
# 通道 ①/② 的写法与坑来自 .github/workflows/ios-tweak.yml 的真实运行教训，
# 直接沿用，不要"顺手改好"：
#   · 推送 URL 必须用 ${{ secrets.GITHUB_TOKEN }}（$GITHUB_TOKEN 不是 Actions 的
#     默认环境变量，在 set -u 下展开未定义变量会让 bash 立刻退出）；
#   · 诊断步骤一律显式 exit 0，绝不能让取证本身改变 job 结论；
#   · 逐文件 git add -f（目录级 add 遇到被忽略的路径会整体失败）。

name: ios-autoclick

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/auto/**"
      - ".github/workflows/ios-autoclick.yml"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.pkg }} (${{ matrix.scheme || 'rootful' }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pkg: [tweak, dylib]
        # rootless = Dopamine / 无根越狱（目标机 iPhone 7 Plus / iOS 15.8.3 走这个）
        scheme: ["rootless", ""]
    env:
      PKG: ${{ matrix.pkg }}
      SCHEME: ${{ matrix.scheme }}
      LEG: ${{ matrix.pkg }}-${{ matrix.scheme || 'rootful' }}
    steps:
      - uses: actions/checkout@v7

      - name: 环境信息（取证）
        run: |
          set -euo pipefail
          sw_vers
          xcodebuild -version || true
          uname -m
          clang --version

      - name: 安装 ldid / xz / dpkg
        run: |
          set -uo pipefail
          # 这一步不进 build.log 的话，远端看不到 brew 到底装成了什么。
          {
          brew install ldid xz dpkg || true
          which ldid || brew link --overwrite ldid || true
          ldid -h >/dev/null || true
          # 报出来（进 build.log 才算数）
          echo "dpkg-deb  -> $(command -v dpkg-deb || echo '缺失')"
          echo "dpkg      -> $(command -v dpkg || echo '缺失')"
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: 克隆 Theos
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          ok=0
          for i in 1 2 3 4 5; do
            rm -rf "$THEOS"
            if git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"; then ok=1; break; fi
            echo "::warning::克隆 Theos 第 $i 次失败，退避 $((i * 10))s 后重试"
            sleep $((i * 10))
          done
          [ "$ok" = "1" ] || { echo "::error::克隆 Theos 连续 5 次失败"; exit 1; }
          test -f "$THEOS/makefiles/common.mk" || { echo "::error::Theos 克隆不完整"; exit 1; }
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Theos HEAD: $(git -C "$THEOS" rev-parse HEAD)"

      # ── 进 clang 之前先做能做的静态检查 ─────────────────────────────────
      # 这几步都很便宜，且都实测过（本机无 clang，所以它们是"编译失败"的第一道滤网）。
      # 顺序有意为之：自检 → 体检，这样"检查器自己坏了"和"代码坏了"能分开。
      - name: 工作流与 ObjC 结构体检
        run: |
          set -euo pipefail
          cd ios/auto
          # `--selftest` 会往内存副本里注入 5 个已知必错的变异（块标量脱出、
          # 顶层键白名单、目录级 git add、${{ }} 不配对），断言体检**确实报了出来**。
          # 没有这一步，下面那句「结构体检通过」什么都证明不了 ——
          # 「什么都报不出来」与「工作流很干净」在输出上无法区分。
          node tools/lint-workflow.mjs ../../.github/workflows/ios-autoclick.yml --selftest
          # YAML 合法 ≠ shell 合法：`edit` 结尾换行不对称会把两行粘成
          # `if …; then echo x          while …`，PyYAML 与 lint-workflow 都看不见，
          # **只有 bash -n 会报**。本机有 Git 自带的 bash，所以这一步能在推之前跑。
          node tools/check-run-shell.mjs ../../.github/workflows/ios-autoclick.yml --selftest
          # 先证明检查器自己有效（对 4 个植入错误都能报出来），再拿它查真代码。
          node tools/selftest-check-objc.mjs .
          node tools/check-objc.mjs .
          # 同上：注解通道的净化器（step「错误注解」里的 sanitize）也要自证有效。
          # 它坏掉的后果是**整条腿变红而构建其实是全绿的** —— 第 15 次 CI 就是
          # `Binary: unbound variable`。这个探针同时验证「原样文本确实会炸」。
          sh tools/tsan-sanitize.sh
          # ── check-plist.sh 的三级降级 + 退出码，用真文件/敌意文件各验一遍 ──
          # ★ 为什么必须验：这个脚本第一版的退出码被管道吞掉（拿到的是 `tr` 的 0），
          #   「没命中」和「不是 plist」两种情形都报 rc=0 还打 ok —— **判据全绿、
          #   事实全错**，而 CI 上只看到一行 ok。第二版才发现**我们的 plist 是
          #   NeXTSTEP 旧 ASCII 格式，plistlib 根本不认**。
          echo "── check-plist.sh 回归"
          for k in good nobundle notplist; do
            python3 tools/make-hostile-plist.py "$RUNNER_TEMP/hp-$k.plist" --kind=$k
          done
          expect_rc() {   # $1=期望退出码  $2=文件  $3=说明
            sh tools/check-plist.sh "$2" >/dev/null 2>&1
            got=$?
            if [ "$got" = "$1" ]; then echo "  ok  $3  rc=$got"; else echo "  FAIL $3  期望 rc=$1 实际 rc=$got"; exit 1; fi
          }
          expect_rc 0 tweak/AMAutoClick.plist          "真 plist（旧 ASCII 格式）判为命中"
          expect_rc 0 "$RUNNER_TEMP/hp-good.plist"     "binary plist 命中"
          expect_rc 3 "$RUNNER_TEMP/hp-nobundle.plist" "binary plist 未命中"
          expect_rc 4 "$RUNNER_TEMP/hp-notplist.plist" "不是 plist"
          expect_rc 1 "$RUNNER_TEMP/hp-missing.plist"  "路径不存在"

      # ── core 的编译 + 回归（跨编译器验证）────────────────────────────────
      # 这 377 个用例平时在 Windows/MSVC 上跑。clang 下再跑一遍能同时抓到两类问题：
      #   · core 里 MSVC 容忍而 clang 不容忍的写法（隐式声明、窄化、变长数组…）
      #   · golden 夹具在两套浮点/整型规则下是否给出同样的峰值
      # 期望值来自本机 MSVC 实测：125/84/56/13/18/21/60。计数对不上就失败 ——
      # 用例数变少同样意味着有东西没编进去。
      - name: core 编译（clang，-Wall -Wextra）
        run: |
          set -euo pipefail
          cd ios/auto
          mkdir -p tests/build
          INC="-Icore -Itests -Imatcher_golden -Imatcher_golden_neg -Imatcher_golden_pkg"
          CORE="core/auto_script.c core/am_json.c core/am_container.c core/auto_match.c core/am_fft.c core/am_fft_accel.c"
          CF="-std=c11 -O2 -Wall -Wextra -Wno-unused-parameter -D_CRT_SECURE_NO_WARNINGS"
          # ★ macOS 上**必须**打开 AM_FFT_ACCELERATE 并链 Accelerate：
          #   core/am_fft_accel.c 的 vDSP 分支只在 iOS/macOS 上编得出来，而它是
          #   真机性能的关键路径（标量 C 实测比 30 ms 预算慢 4.26 倍）。
          #   不打开的话 test_fft 的 [6] 段会退化成「自己跟自己对」——
          #   那一段里有一条断言专门查这件事，所以忘掉的后果是**当轮 CI 变红**，
          #   而不是悄悄少测一截。
          CF="$CF -DAM_FFT_ACCELERATE=1"
          LD="-framework Accelerate"
          : > "$RUNNER_TEMP/build.log"
          # ★ 夹具 ios/auto/matcher_golden_pkg 不入库：它整个目录（sample.auto + pkg/*.png +
          #   script.json + golden_pkg*.{json,h}）都是 `python tools/make_package_golden.py
          #   <.auto> matcher_golden_pkg` 从**真游戏包**（21 MB 素材）重建出来的，
          #   按本仓库「游戏素材/大二进制不进 git」的规矩留在本机。
          #   在 ⇒ 八套全编（含需要 golden_pkg_cases.h 的四套）；
          #   不在 ⇒ 只编不依赖夹具的三套，并打 ::warning::（**不静默变成"全绿"**）。
          if [ -f matcher_golden_pkg/golden_pkg_cases.h ]; then
            TESTS="test_fft test_json test_script test_matcher test_matcher_neg test_package test_engine audit_caps"
          else
            TESTS="test_fft test_matcher test_matcher_neg"
            echo "::warning::ios/auto/matcher_golden_pkg 不存在 ⇒ 只编 3 套不依赖夹具的用例；本机重建：python ios/auto/tools/make_package_golden.py <.auto> ios/auto/matcher_golden_pkg"
          fi
          for t in $TESTS; do
            extra=""
            [ "$t" = "test_engine" ] && extra="core/auto_engine.c"
            # audit_caps 要真的把脚本装进引擎（am_engine_*），所以也要 auto_engine.c。
            [ "$t" = "audit_caps" ] && extra="core/auto_engine.c"
            echo "=== clang $t" | tee -a "$RUNNER_TEMP/build.log"
            # shellcheck disable=SC2086
            clang $CF $INC $LD -o "tests/build/$t" "tests/$t.c" $CORE $extra 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          done

      - name: core 回归（377 例，计数硬校验）
        run: |
          # ★ 整段包进花括号 + tee（第 13 次 CI 的教训）：本步骤的 stdout **不在**
          #   ci-diag/*/build.log 里，而 job 日志 API 需要更高权限 —— 于是远端只能
          #   看到「这一步 failure」，连哪个用例、哪个期望值都对不上都不知道。
          #   「把 info 打出来」和「把 info 打进唯一可读的那条通道」是两件事。
          #   注意这里**不用 set -e**：run() 自己判返回码，用 -e 的话第一条失败就
          #   整段退出，后面六套的输出全丢。rc 由 bad() 累计、最后显式 exit $rc。
          set -uo pipefail
          cd ios/auto
          {
          rc=0
          bad() { echo "::error::$1"; rc=1; }
          # 用例名 : 夹具目录参数 : 期望的 "N passed" 行
          run() {  # $1=exe $2=dir $3=期望
            local exe="$1" dir="$2" want="$3" out got
            out=$(./tests/build/"$exe" $dir 2>&1); local r=$?
            got=$(printf '%s\n' "$out" | grep -oE '[0-9]+ passed' | tail -1)
            echo "--- $exe (dir='$dir') rc=$r got='${got:-无}' want='$want'"
            if [ "$want" != "-" ]; then
              # 只在没命中时才把尾巴打出来 —— 命中时日志短，出问题时日志全。
              printf '%s\n' "$out" | grep -q "$want" || {
                echo "$out" | tail -12
                bad "$exe 期望 '$want' 但没出现（rc=$r，实际 '$got'）"; return 1; }
            fi
            [ "$r" -eq 0 ] || { echo "$out" | tail -12; bad "$exe 退出码 $r"; return 1; }
            return 0
          }
          # ★ 这里的数值是承重的：test_engine 少传 \pkg 会因为「夹具目录里没东西」
          #   静默跳过 24 个用例（36 passed），只看退出码是看不出来的。
          run test_fft          ""                    "125 passed" || true
          # ★ 夹具缺席时（见上面 core 编译那步的说明）跳过夹具相关的四项检查，
          #   并**在日志里点名**说清楚少跑了什么 —— 静默变成"全绿"才是真危险。
          if [ -f matcher_golden_pkg/sample.auto ]; then
          run test_json         "matcher_golden_pkg"  "84 passed"  || true
          run test_script       "matcher_golden_pkg/pkg" "56 passed" || true
          # ── 能力上限审计（不是用例，是一条独立的断言）────────────────────
          # core/auto_script.h 里的 AM_MAX_* 是当初按最坏情况估的，**估小了会静默
          # 丢东西**（只置 s->overflow_* 计数，脚本照样"加载成功"）⇒ 现场表现是
          # 「有些按钮不点」而日志里什么都看不出。所以这里量出真脚本在每一个
          # 编译期上限上用了多少，并要求**一个都没溢出**。
          # 只在 .auto 压缩包形态上跑一次：目录形态读的是同一份 script.json，
          # 本机实测两份数字完全一致，跑两遍只是浪费时间。
          echo "--- audit_caps (dir='matcher_golden_pkg/sample.auto')"
          audit_out=$(./tests/build/audit_caps matcher_golden_pkg/sample.auto 2>&1); audit_rc=$?
          printf '%s\n' "$audit_out" | grep -E '模板组|变量 |场景 |单场景|单事件|单变量|单组|溢出计数|没有任何溢出|加载失败' || true
          if [ "$audit_rc" -ne 0 ]; then
            printf '%s\n' "$audit_out" | tail -12
            bad "audit_caps 退出码 $audit_rc（脚本没装进引擎，或有维度溢出了）"
          fi
          printf '%s\n' "$audit_out" | grep -q "没有任何溢出" || bad "audit_caps 没说『没有任何溢出』"
          run test_package      "matcher_golden_pkg"  "21 passed" || true
          run test_engine       "matcher_golden_pkg/pkg" "60 passed" || true
          else
            echo "::warning::ios/auto/matcher_golden_pkg 不存在 ⇒ 跳过 test_json / test_script / test_package / test_engine 与 audit_caps（夹具相关的计数断言本轮未跑）；本机重建：python ios/auto/tools/make_package_golden.py <.auto> ios/auto/matcher_golden_pkg"
          fi
          run test_matcher      "matcher_golden"      "13 passed" || true
          run test_matcher_neg  "matcher_golden_neg"  "18 passed" || true
          if [ "$rc" -eq 0 ]; then echo "core 回归通过（计数硬校验 + 能力上限审计；夹具缺席时按上方 ::warning:: 少跑 4 套）"; fi
          exit $rc
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # ── grep 模式的阴性对照 ──────────────────────────────────────────────
      # 上面的 run() 用 `grep -q "<N> passed"` 判成败：模式一旦写错（大小写、
      # 空格、行尾被加了 `|| true`），这一步会**永远通过**或**永远失败**，而两种
      # 情况在 CI 上都只是"一条日志"。这个脚本拿真实输出对一遍，并且：
      #   · 模式**从工作流现读**（不另抄一份会漂的表）
      #   · 少于 7 条就报错 —— **全绿而什么都没验，正是它自己失配时的样子**
      #     （真发生过：给工作流加 `|| true` 之后 `\s*$` 一条都匹配不上，
      #      而脚本打印的是「0 个不匹配 / 模式与真实输出一致」）
      #   · `--selftest` 把 7 个期望值全改成 `1 passed`，断言它**确实报错**
      - name: grep 模式校验（读自工作流，含阴性对照）
        run: |
          set -euo pipefail
          cd ios/auto
          # ★ 这个脚本要**真跑**测试二进制（拿真实输出核对模式 + 阴性对照），
          #   所以夹具不在时它必然全 FAIL —— 那不是"模式写错了"，是没东西可跑。
          #   缺席就跳过并点名，别让它把夹具缺失误报成模式回归。
          if [ ! -f matcher_golden_pkg/sample.auto ]; then
            echo "::warning::ios/auto/matcher_golden_pkg 不存在 ⇒ 跳过 grep 模式校验（它要真跑测试二进制）；本机重建夹具后再跑：node ios/auto/tools/check-test-patterns.mjs ios/auto ../../.github/workflows/ios-autoclick.yml --selftest"
            exit 0
          fi
          node tools/check-test-patterns.mjs . ../../.github/workflows/ios-autoclick.yml --selftest

      # ── 交付物 ①/②：Theos 编译 ──────────────────────────────────────────
      - name: 构建 ${{ matrix.pkg }}
        working-directory: ios/auto/${{ matrix.pkg }}
        run: |
          set -euo pipefail
          if [ -n "$SCHEME" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          echo "=== pkg=$PKG scheme=${THEOS_PACKAGE_SCHEME:-<rootful>} THEOS=$THEOS"
          set -o pipefail
          make FINALPACKAGE=1 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # dylib 工程的产物是裸 .dylib，没有 deb（它不装进系统，是被注入 app 包的）。
      # tweak 工程才走打包 —— Theos 对 library 目标也能 package，但产物没意义。
      - name: 打包 deb（仅 tweak）
        if: matrix.pkg == 'tweak'
        working-directory: ios/auto/tweak
        run: |
          set -euo pipefail
          if [ -n "$SCHEME" ]; then export THEOS_PACKAGE_SCHEME="$SCHEME"; fi
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # ── 结构断言：光"编过了"不够，要证明产物是对的东西 ──────────────────
      # 这是本工作流真正的价值所在：把 deb/dylib 里那些**只有当链接或安装路径写错
      # 时才会出现的症状**变成硬失败，而不是等到真机上才发现。
      - name: 产物结构断言
        working-directory: ios/auto/${{ matrix.pkg }}
        run: |
          #
          # 为什么把整段包进 `{ … } | tee -a "$RUNNER_TEMP/build.log"`：
          # 断言步骤的 stdout **不在** ci-diag 分支的 build.log 里 —— build.log 只收
          # 被 `tee` 过的那几步（core 编译 / core 回归 / 构建 / 打包）。而 job 日志
          # API 要更高权限（匿名 403），check-run 注解对本机的 PAT 也取回来是空的。
          # 于是"断言失败了"这一条到了我这边就只剩「这一步 failure」，
          # 具体是哪一条断言、真实输出长什么样，全都看不到 —— 只能靠猜。
          # 包一层 tee 之后，取证信息就落进唯一可读的那条通道了。
          #
          # 顺带：**不要 `set -e`**。断言失败时我们要先把取证信息全打出来再退出；
          # `set -e` 会让 bash 在第一条失败的 grep 上立刻退出，上面的目的就落空了。
          # 判据仍然严格：rc 从 0 起，任何一条不满足就置 1，最后显式 exit。
          # （`set -o pipefail` 保证 `{ … } | tee` 这条管道的退出码来自 `{ … }`。）
          #
          set -uo pipefail
          {
          rc=0
          bad() { echo "::error::$1"; rc=1; }
          echo "=== uname / xcode"
          uname -a
          echo "=== pwd 与顶层目录（确认工作目录就是工程目录）"
          pwd
          ls -la
          echo "=== 工具在不在"
          for t in lipo otool nm file dpkg-deb find sort head; do
            command -v "$t" >/dev/null 2>&1 && echo "  ok  $t -> $(command -v "$t")" || echo "  ✗ 缺 $t"
          done
          xcodebuild -version 2>/dev/null | head -2 || true
          echo "=== .theos 树（前 60 行）"
          find .theos 2>/dev/null | sort | head -60 || echo "（没有 .theos 目录）"
          echo "=== 所有 Mach-O 候选（*.dylib / 无扩展名的可执行）"
          find .theos \( -name '*.dylib' -o -name '*.a' -o -name '*.o' \) 2>/dev/null | sort | head -40 || true
          dylib=$(find .theos -name '*.dylib' | head -1)
          if [ -z "$dylib" ]; then
            bad "没有产出任何 .dylib"
            echo "=== 断言到此结束 rc=1"
            exit 1
          fi
          echo "=== 产物：$dylib"
          ls -l "$dylib"
          file "$dylib"
          echo "=== 架构必须是 arm64"
          lipo -info "$dylib"
          lipo -info "$dylib" | grep -q arm64 || bad "不是 arm64：$(lipo -info "$dylib")"
          echo "=== otool -L（确认链了什么）"
          otool -L "$dylib"
          echo "=== 未定义符号（前 60 条）"
          nm -u "$dylib" | head -60 || true
          if [ "$PKG" = "tweak" ]; then
            # 越狱版：必须有 substrate 依赖，且**不能**链 substrate 本身
            # （它是 Tweak.x 的 %hook 展开依赖，由宿主进程提供）。
            echo "=== tweak：确认 Tweak.x 的 logos 展开真的进来了"
            if nm -u "$dylib" | grep -q '_MSHookMessageEx'; then
              echo "ok: 找到 _MSHookMessageEx"
            else
              bad "tweak 里没有 _MSHookMessageEx —— %hook 没被展开，Tweak.x 可能没编进去"
            fi
          else
            # 非越狱版：**绝不能**引用 substrate（App 进程里没有 libsubstrate/ellekit）。
            echo "=== dylib：确认没有 substrate 符号"
            hits=$(nm -u "$dylib" | grep -E 'MSHookMessageEx|MSHookFunction|_MSGetImageByName' || true)
            if [ -n "$hits" ]; then
              echo "$hits"
              bad "dylib 引用了 substrate 符号 —— 在非越狱 App 里会 dyld 报错"
            else
              echo "ok: 没有 substrate 符号"
            fi
            echo "=== dylib：确认没有 %hook 展开（应为空）"
            # 不能直接 grep 源码 —— dylib.x 的注释里就写着「%hook / %orig 不能用」，
            # 第 9 次 CI 正是被这句注释误判成红（真正的 logos 宏在明文注释里找不到，
            # 去掉注释再查才是真的在查宏）。这里用 clang 自己预处理一份再查。
            # 用 printf 造一份「注释已剥离」的副本，再用 clang -E 预处理，最后查真宏。
            # 不直接 grep 源码的理由：dylib.x 的注释里就写着「%hook / %orig 不能用」，
            # 第 9 次 CI 正是被这句注释误判成红。多行命令统一用 printf 拼，
            # 避免行尾续行符（本工作流的缩进体检会把它当成缩进异常）。
            printf '%s\n' "sed -E 's://.*\$::' dylib.x > \"\$RUNNER_TEMP/dylib.nowx\"" "clang -E -P -x objective-c -I\"\$GITHUB_WORKSPACE/ios/auto/core\" -I\"\$GITHUB_WORKSPACE/ios/auto/ios\" \"\$RUNNER_TEMP/dylib.nowx\" > \"\$RUNNER_TEMP/dylib.pre\" 2>/dev/null" > "$RUNNER_TEMP/nologos.sh"
            if bash "$RUNNER_TEMP/nologos.sh" && [ -s "$RUNNER_TEMP/dylib.pre" ]; then
              if grep -nE 'MSHook|_logos_|%hook|%orig' "$RUNNER_TEMP/dylib.pre"; then
                bad "dylib.x 预处理后仍出现 logos 宏 —— 非越狱侧不能用"
              else
                echo "ok: dylib.x 预处理干净（注释已剥离，查的是真宏）"
              fi
            else
              echo "clang -E 预处理失败，退回按行查（跳过注释行）"
              if grep -nE '%hook|%orig|MSHook' dylib.x | grep -vE '^[0-9]+: *(//|\*|/\*)'; then
                bad "dylib.x 里出现 logos 宏 —— 非越狱侧不能用"
              else
                echo "ok: dylib.x 干净（无注释行命中）"
              fi
            fi
          fi
          echo "=== 断言结束 rc=$rc"
          exit $rc
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: deb 结构断言（仅 tweak）
        if: matrix.pkg == 'tweak'
        working-directory: ios/auto/tweak
        run: |
          # 同「产物结构断言」：整段包进 tee 才会落进 ci-diag 的 build.log，
          # 并且不用 `set -e`（先取证再退出）。理由见上面那一步的长注释。
          set -uo pipefail
          {
          rc=0
          bad() { echo "::error::$1"; rc=1; }
          echo "=== 工具在不在（dpkg-deb 缺失会让下面的 lst 变成空串，必须在这里看出来）"
          for t in dpkg-deb dpkg ar tar; do
            command -v "$t" >/dev/null 2>&1 && echo "  ok  $t -> $(command -v "$t")" || bad "缺 $t"
          done
          echo "=== packages/ 里的东西"
          ls -l packages/ 2>/dev/null || echo "（没有 packages/ 目录）"
          echo "=== 整个工程目录里所有 .deb"
          find . -name '*.deb' 2>/dev/null | sort
          deb=$(find . -name '*.deb' | head -1)
          if [ -z "$deb" ]; then
            bad "没有产出 .deb"
            exit 1
          fi
          echo "=== $deb"
          ls -l "$deb"
          echo "=== dpkg-deb -I"
          dpkg-deb -I "$deb"
          echo "=== 内容清单"
          dpkg-deb -c "$deb"
          lst=$(dpkg-deb -c "$deb")
          # 过滤器 plist 必须和 dylib 同目录 —— 少了它 substrate 不知道往哪个进程注入。
          # 这一条是**真找到过 bug 的**：第 11 次 CI 之前 tweak/Makefile 用的是 library.mk，
          # 而只有 instance/tweak.mk 有拷贝过滤器 plist 的规则 ⇒ 构建成功、deb 也出得来、
          # 里面却只有 dylib。真机表现是「装上了什么都不发生」，无任何报错。
          echo "$lst" | grep -q 'AMAutoClick\.dylib' || bad "deb 里没有 AMAutoClick.dylib"
          echo "$lst" | grep -q 'AMAutoClick\.plist' || bad "deb 里没有过滤器 plist（tweak/Makefile 得用 tweak.mk）"
          # ★ 路径前后缀：实测（第 12 次 CI 的 hint 里那条 `::error` 是误报）——
          # dpkg-deb -c 把 `./` **吃掉了**，输出形如
          #     drwxr-xr-x root/wheel 0 … var/jb/Library/MobileSubstrate/…
          # 既不是 `/var/jb/`（第一版，锚在开头 ⇒ 永远不匹配）也不是 `./var/jb/`
          # （第二版，同样不匹配）。可靠的口径是「前面是行首或空白」：
          if [ -n "$SCHEME" ]; then
            echo "$lst" | grep -qE '(^|[[:space:]])var/jb/' || bad "rootless 构建的 deb 里没有 /var/jb/ 前缀"
            # 反向也判一次：rootless 的 deb 里不该出现「裸的」Library/MobileSubstrate
            # （那说明 Theos 的 scheme 没生效，装到越狱设备上会落到根文件系统）。
            # ★ 这条必须锚在「行首或空白」，否则会命中 var/jb/Library/MobileSubstrate。
            if echo "$lst" | grep -qE '(^|[[:space:]])Library/MobileSubstrate/'; then
              bad "rootless 构建里出现了不带 /var/jb 前缀的 /Library/MobileSubstrate"
            fi
            echo "  ok  rootless 的安装路径都带 var/jb 前缀"
          fi
          # 过滤器内容必须是目标 bundle id（写错就是"装上了但什么都不发生"）。
          tmp=$(mktemp -d); dpkg-deb -x "$deb" "$tmp"
          echo "=== 解包后的文件树"
          find "$tmp" -type f | sort
          plist=$(find "$tmp" -name 'AMAutoClick.plist' | head -1)
          echo "=== 过滤器 plist（**不要 cat**，它是 plist 不是文本）"
          # ★ 为什么要绕这一下（第 15/16 次 CI 的真实教训）：这一段的 stdout 经 tee 进
          #   build.log，而 step「错误注解」会把 build.log 的每行原样发成 `::notice`。
          #   GitHub 再把注解文本回灌进下一步的临时脚本 —— 于是 binary plist 里的
          #   `$Binary` 变成了 shell 的未定义变量（`Binary: unbound variable`），
          #   同一批字节还会让 `cut` 报 `Illegal byte sequence`，
          #   两次都是**整条腿判红而构建其实是全绿的**。
          #   **凡是会进 build.log 的东西，都要在源头换成纯文本。**
          # ★ 判据本身也搬进了脚本（tools/check-plist.sh），不再内联在 run 里：
          #   ① 内联多行 python 必须整体缩进，我那次把它们顶到第 0 列 ⇒ PyYAML 报
          #      `while scanning a simple key … could not find expected ':'`
          #      （lint-workflow.mjs 现在有规则专门抓这个）；
          #   ② 更重要：**我们的 plist 是 NeXTSTEP 旧 ASCII 格式，plistlib 不认**
          #      （`InvalidFileException: Invalid file`），必须三级降级才判得出来。
          #      详见 ios/auto/tools/check-plist.sh 的文件头。
          if sh tools/check-plist.sh "$plist"; then
            echo "  ok  过滤器里同时有 com.leiting.wf 与 worldflipper"
          else
            bad "过滤器 plist 检查失败（见上面 check-plist.sh 的输出）"
          fi
          echo "=== 断言结束 rc=$rc"
          exit $rc
          } 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      # ── 诊断通道 ①：完整日志 ─────────────────────────────────────────────
      - name: 诊断日志（失败时也可无凭据取回）
        if: always()
        run: |
          set -uo pipefail
          DIAG_REF="ci-diag/${GITHUB_RUN_ID}/${LEG}"
          DIAG_DIR="ci-diag/${GITHUB_RUN_ID}/${LEG}"
          mkdir -p "$DIAG_DIR"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "leg=${LEG}"
            echo "pkg=${PKG}"
            echo "scheme=${SCHEME:-rootful}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "head_sha=${GITHUB_SHA}"
            echo "runner_os=${RUNNER_OS}"
            echo "theos=${THEOS:-<unset>}"
            echo "build_log_bytes=$(wc -c < "$RUNNER_TEMP/build.log" 2>/dev/null || echo 0)"
          } > "$DIAG_DIR/meta.txt"
          cp "$RUNNER_TEMP/build.log" "$DIAG_DIR/build.log" 2>/dev/null \
            || echo "build.log 不存在或为空（构建步骤可能从未开始）" > "$DIAG_DIR/build.log"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in "$DIAG_DIR/meta.txt" "$DIAG_DIR/build.log"; do
            git add -f -- "$f" || echo "::warning::诊断文件无法加入索引：$f"
          done
          if ! git commit -q -m "ci-diag: ${LEG} run ${GITHUB_RUN_ID}"; then
            echo "::warning::诊断提交失败（可能索引为空）"; git status --short | head -20; exit 0
          fi
          if git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:refs/heads/${DIAG_REF}" 2>&1; then
            echo "诊断日志已推送：refs/heads/${DIAG_REF}"
          else
            echo "::warning title=diag-push::诊断分支推送失败（fork 可能未授予 Actions 写权限）"
          fi
          exit 0

      # ── 诊断通道 ②：产物出仓（无凭据可下载，真机验证靠它）───────────────
      - name: 产物出仓
        if: always()
        working-directory: ios/auto/${{ matrix.pkg }}
        run: |
          set -uo pipefail
          OUT_REF="ci-out/${GITHUB_RUN_ID}/${LEG}"
          OUT_DIR="${GITHUB_WORKSPACE}/ci-out/${GITHUB_RUN_ID}/${LEG}"
          mkdir -p "$OUT_DIR"
          dylib=$(find .theos/obj -name '*.dylib' 2>/dev/null | head -1 || true)
          deb=""
          for f in packages/*.deb; do [ -f "$f" ] && deb="$f" && break; done
          dylib_bytes=0; dylib_sha="(none)"
          deb_bytes=0;   deb_sha="(none)"
          if [ -n "$dylib" ]; then dylib_bytes=$(wc -c < "$dylib"); dylib_sha=$(shasum -a 256 "$dylib" | cut -d' ' -f1); fi
          if [ -n "$deb" ];   then deb_bytes=$(wc -c < "$deb");     deb_sha=$(shasum -a 256 "$deb" | cut -d' ' -f1); fi
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "leg=${LEG}"
            echo "head_sha=${GITHUB_SHA}"
            echo "dylib=${dylib:-（没有产物）}"
            echo "dylib_bytes=${dylib_bytes}"
            echo "dylib_sha256=${dylib_sha}"
            echo "deb=${deb:-（没有产物）}"
            echo "deb_bytes=${deb_bytes}"
            echo "deb_sha256=${deb_sha}"
          } > "$OUT_DIR/meta.txt"
          [ -n "$dylib" ] && cp "$dylib" "$OUT_DIR/AMAutoClick.dylib"
          [ -n "$deb" ]   && cp "$deb"   "$OUT_DIR/"
          printf '::notice title=ci-out(%s)::dylib=%s bytes sha=%s; deb=%s bytes sha=%s\n' \
            "$LEG" "$dylib_bytes" "$dylib_sha" "$deb_bytes" "$deb_sha"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          staged=0
          for f in "$OUT_DIR/meta.txt" "$OUT_DIR/AMAutoClick.dylib" "$OUT_DIR"/*.deb; do
            [ -f "$f" ] || continue
            if git add -f -- "$f"; then staged=$((staged + 1)); else echo "::warning::产物无法加入索引：$f"; fi
          done
          if [ "$staged" -eq 0 ]; then
            echo "::warning title=ci-out::没有任何产物可推送（构建可能从未产出 dylib/deb）"; exit 0
          fi
          if ! git commit -q -m "ci-out: ${LEG} run ${GITHUB_RUN_ID}"; then
            echo "::warning::产物提交失败（可能索引为空）"; git status --short | head -20; exit 0
          fi
          if git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
                "HEAD:refs/heads/${OUT_REF}" 2>&1; then
            echo "产物已推送：refs/heads/${OUT_REF}"
          else
            echo "::warning title=ci-out-push::产物分支推送失败（fork 可能未授予 Actions 写权限）"
          fi
          exit 0

      # ── 诊断通道 ③：编译器要害 → check-run 注解（纯匿名 HTTP 可读）──────
      - name: 错误注解
        if: always()
        run: |
          # ⚠️ 这一整段是诊断，**绝不允许它把 job 判红**。
          #
          # 第 14 次 CI 的真实现象：编译、打包、两条结构断言全部 success，
          # 四条腿却都挂在「15.错误注解」上，而 build.log 到「=== 断言结束 rc=0」
          # 就结束了 —— 说明脚本在这段里带着非 0 退出码死了。
          # 根因是下面第 456 行那种「守卫 && 动作」：`[ A ] || echo …` 在 A 成立时
          # 整个列表返回 1，而 GitHub Actions 的默认 shell 是 `bash -e`，
          # **最后一条命令的退出码就是这一步的退出码** ⇒ step failure。
          # （同一个坑在本工作流的「通过性摘要」和 display 函数里各踩过一次。）
          #
          # 现在的原则：**这里每一条可能返回非 0 的命令都自带 `|| true`，
          # 且末尾无条件 `exit 0`。**取证少了可以再补，把绿的 job 弄红是纯损失。
          set -uo pipefail
          if [ ! -s "$RUNNER_TEMP/build.log" ]; then
            echo "::notice title=autoclick(${LEG})::该腿未产生构建输出（编译步骤可能未开始）"
            exit 0
          fi
          echo "::notice title=build.log(${LEG})::共 $(wc -l < "$RUNNER_TEMP/build.log") 行 / $(wc -c < "$RUNNER_TEMP/build.log") 字节"
          total_lines=$(wc -l < "$RUNNER_TEMP/build.log")
          max_lines=750
          if [ "$total_lines" -gt "$max_lines" ]; then
            echo "::warning title=build.log(${LEG})::日志共 ${total_lines} 行，只发前 ${max_lines} 行（其余靠 ci-diag 分支）"
          fi
          if [ "$total_lines" -le "$max_lines" ]; then emit_to=$total_lines; else emit_to=$max_lines; fi
          start=1; chunk=0
          # ★ 净化：注解文本会被 GitHub **原样回灌进下一步的临时脚本文件**，
          #   所以 `::notice::` 后面的字节就是下一段 shell 的源码。build.log 里
          #   有二进制（deb 断言那段 cat 过 binary plist，含 NUL 与控制字节），
          #   第 15 次 CI 因此死在
          #     /Users/<runner>/work/_temp/<uuid>.sh: line 43: Binary: unbound variable
          #   —— 那行二进制里恰好有 `$Binary`，在 `set -u` 下成了未定义变量，
          #   脚本带着 1 退出，而且发生在 `exit 0` 之前。教训：
          #   **注解通道 = 把日志当脚本喂给下游，必须先去控制字符与元字符。**
          #
          #   过滤分三层，每一层都由 ios/auto/tools/tsan-sanitize.sh 实测过：
          #     ① `tr -d '\000-\010\013\014\016-\037\134'`：NUL、其它控制字符
          #        与反斜杠（`\134`）。（**换行必须留着**，下面按行处理；行内本来
          #        也不会有换行。）
          #     ② `LC_ALL=C cut -c1-400`：截断。★ **`LC_ALL=C` 是必需的**：
          #        第 16 次 CI 就是它报 `cut: stdin: Illegal byte sequence` 把腿弄红的
          #        —— 在 UTF-8 locale 下 `cut -c` 走的是按字符计数的路径，遇到非法
          #        字节序列直接报错退出（GNU coreutils；macOS 的 BSD cut 同理）。
          #        第 ① 步已经去掉了控制字符，但 0x80-0xFF 这些高位字节还在。
          #     ③ `tr -cd '\040-\176'`：只留可打印 ASCII（UTF-8 中文会被去掉，
          #        这是可接受的 —— 日志的英文部分才是要看的）
          #     ④ `tr '$`[]*?' '??????'`：shell 元字符全部换成 `?`。少了 `[`
          #        这一项时，`bplist00…Bundles[Executables…` 会让 bash 报
          #        `unexpected EOF while looking for matching ]`；少了 `$` 就是
          #        第 15 次 CI 的 `Binary: unbound variable`。
          #     ★ 第 ④ 步**不要写反斜杠**：`tr '$`[]*?\' '…'` 末尾是裸反斜杠，
          #       GNU tr 会警告 `an unescaped backslash at end of string is not
          #       portable`，BSD tr（macOS）的解释未定义。反斜杠在上面第 ① 步
          #       用 `\134` 删掉了，所以这里根本不需要它。
          sanitize() {
            LC_ALL=C tr -d '\000-\010\013\014\016-\037\134' | LC_ALL=C cut -c1-400 \
              | LC_ALL=C tr -cd '\040-\176' | LC_ALL=C tr '$`[]*?' '??????'
          }
          while [ "$start" -le "$emit_to" ]; do
            end=$((start + 29)); if [ "$end" -gt "$emit_to" ]; then end=$emit_to; fi
            chunk=$((chunk + 1))
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              line=$(printf '%s' "$line" | sanitize)
              [ -n "$line" ] || continue
              printf '::notice title=build-log(%s)-%02d::%s\n' "${LEG}" "$chunk" "$line"
            done < <(sed -n "${start},${end}p" "$RUNNER_TEMP/build.log")
            start=$((end + 1))
          done
          echo "::notice title=build-log(${LEG})::全文通道已发 ${chunk} 块"
          n=0
          emit() {  # $1=类别 $2=正则 [$3=上下文行数]
            local ctx="${3:-5}" hits ln from to
            hits=$(grep -nEi "$2" "$RUNNER_TEMP/build.log" 2>/dev/null | cut -d: -f1 | head -3 || true)
            [ -n "$hits" ] || return 0
            for ln in $hits; do
              [ "$n" -ge 8 ] && break
              from=$(( ln > ctx ? ln - ctx : 1 )); to=$(( ln + ctx ))
              while IFS= read -r line; do
                [ -n "$line" ] || continue
                line=$(printf '%s' "$line" | sanitize)
                [ -n "$line" ] || continue
                n=$((n + 1))
                printf '::error title=%s-%02d(%s)::%s\n' "$1" "$n" "${LEG}" "$line"
                [ "$n" -ge 8 ] && break
              done < <(sed -n "${from},${to}p" "$RUNNER_TEMP/build.log")
            done
            # 必须以 0 结尾：`[ "$n" -ge 8 ] && break` 在 n<8 时为假（退出码 1），
            # 会把 emit 的返回码带成 1（实测过一次，注解反而变少）。
            return 0
          }
          emit clang-error 'error:|fatal error|no member named|no visible @interface|expected ' 6 || true
          [ "$n" -ge 8 ] || emit link-error 'Undefined symbols|undefined reference|ld: |linker command failed|_OBJC_CLASS_\$_' 8 || true
          [ "$n" -ge 8 ] || emit theos-error 'No such file or directory|missing a filter property list|is not a valid|does not exist' 4 || true
          echo "::notice title=autoclick(${LEG})::分类注解 ${n} 条"
          # 无条件 0：这一段是取证，不是门禁。`|| true` 是双保险（万一上面
          # 又漏了一条守卫式写法）。
          exit 0 || true

      - name: 通过性摘要（notice）
        if: success()
        working-directory: ios/auto/${{ matrix.pkg }}
        run: |
          # ★ 这一整步**必须**显式 exit 0。
          # 第 11 次 CI 的 dylib 两条腿就栽在这里：本步是 `[ -n "$dylib" ] && echo …`
          # 这种「守卫 && 动作」的写法，守卫为假时整行返回 1，而 `set -e`（GitHub 的
          # 默认 shell 就是 bash -e）会把这一步判成失败 —— 于是构建成功、断言 rc=0，
          # 报出来的却是「16.通过性摘要 = failure」。教训：末尾是守卫的复合命令，
          # 要么写成 if，要么显式 exit 0。
          set -uo pipefail
          dylib=$(find .theos/obj -name '*.dylib' 2>/dev/null | head -1 || true)
          deb=$(ls packages/*.deb 2>/dev/null | head -1 || true)
          echo "::notice title=autoclick(${LEG})::pkg=${PKG} scheme=${SCHEME:-rootful} dylib=${dylib:-<none>} deb=${deb:-<none>}"
          if [ -n "$dylib" ]; then
            echo "::notice title=autoclick(${LEG})::dylib 大小 $(wc -c < "$dylib") 字节"
          fi
          if [ -n "$deb" ]; then
            echo "::notice title=autoclick(${LEG})::deb 大小 $(wc -c < "$deb") 字节"
          fi
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoclick-log-${{ env.LEG }}
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 30

      # 产物上传拆成两步：把 packages/*.deb 与 .theos/obj/**/*.dylib 写在同一个 path 里时，
      # 只要第一个 glob 无匹配（构建失败即如此），upload-artifact 会直接失败。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autoclick-${{ env.LEG }}
          path: |
            ios/auto/tweak/packages/*.deb
            ios/auto/dylib/.theos/obj/**/*.dylib
            ios/auto/tweak/.theos/obj/**/*.dylib
          if-no-files-found: warn
          retention-days: 30
